# Sealed Secrets controller - ADR 0006. Decrypts SealedSecrets committed to
# app repos into ordinary Secrets. Its private key is backed up SOPS-encrypted
# at infra/sealed-secrets/; losing both that and the cluster makes every
# sealed secret unreadable.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0 # controller v0.40.0
    helm:
      valuesObject:
        # The name kubeseal looks for by default, so no --controller-name.
        fullnameOverride: sealed-secrets-controller
        # Not in the request path of anything - it only acts when a
        # SealedSecret changes - so ADR 0004's pinning is fine here.
        nodeSelector:
          role: interactive
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
