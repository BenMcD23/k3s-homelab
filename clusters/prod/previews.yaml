# Preview stacks (ADR 0010): any branch of the API, SMS site or cadet portal,
# on seeded data with the dev sign-in, on the tailnet. Label a pull request
# `preview` to start one. This Application installs the machinery; the stacks
# are Applications of their own, made by the ApplicationSet it installs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: previews
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/BenMcD23/k3s-homelab.git
    targetRevision: main
    path: previews/system
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
