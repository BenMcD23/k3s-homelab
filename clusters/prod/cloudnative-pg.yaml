# CloudNativePG operator - ADR 0007. Runs the Postgres clusters and does
# failover, so it must be alive when a database node is not.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1 # operator 1.30.1
    helm:
      valuesObject:
        # Deliberately NOT pinned to home like the rest of the platform: the
        # operator is what promotes a replica, so it can't live only on a node
        # whose failure it has to handle. oracle is always on and holds no
        # database instance; the image is multi-arch.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: role
                      operator: In
                      values: [edge]
        # Default is 5 minutes on a dead node before it's rescheduled.
        tolerations:
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 30
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 30
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for client-side apply's annotation.
      - ServerSideApply=true
