# k3s's bundled Traefik, overriding the chart values k3s ships
# (kube-system/traefik HelmChart). It is the public front door: one replica
# on each oracle node, behind the OCI Network Load Balancer, which health-
# checks both and is what the public DNS points at. Either node can go down.
#
# Why not Funnel: its proxy pod runs WireGuard inside a pod whose MTU is
# already 1230 (flannel over tailscale0), so large responses crawled
# (~21KB/s). Lowering the proxy's MTU fixes that but breaks IPv6 (<1280), and
# raising the nodes' MTU would push home<->squadron onto DERP. Measured
# 2026-09-25: a 160KB response went from 7.6s via Funnel to ~0.7s direct.
#
# svclb forwards each node's :80/:443 to this Service - the host's "only port
# 22" iptables rule doesn't apply to hostPort DNAT - and the OCI security
# list allows all TCP.
#
# No state: certificates come from cert-manager (cert-manager.yaml) as
# Secrets, so there is no acme.json volume pinning Traefik to one node.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # The oracle nodes are the only ones with public IPs; home and squadron
    # are behind NAT. The image is multi-arch.
    nodeSelector:
      role: edge
    deployment:
      replicas: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
    # Two edge nodes, two replicas, one per node: there is no room to surge,
    # so replace one at a time. The load balancer covers the gap.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
