---
- name: Base configuration for all cluster nodes
  hosts: all
  become: true
  tags: [base]
  roles:
    - base

# Order matters: the first server has to be up with --cluster-init before
# anything can join it. serial: 1 below keeps two nodes from registering as
# etcd members at the same time (ADR 0001).
- name: Bootstrap the first k3s server
  hosts: k3s_first_server
  become: true
  tags: [k3s]
  roles:
    - k3s_server

- name: Join the remaining k3s servers
  hosts: k3s_additional_servers
  become: true
  serial: 1
  tags: [k3s]
  roles:
    - k3s_server

# Before Argo CD: the operator is what publishes Argo CD's own UI, and a
# front door cannot depend on the thing it is the front door to. If a sync
# is broken, you still want the UI reachable to see why (ADR 0005).
- name: Install the Tailscale Kubernetes operator
  hosts: k3s_first_server
  become: true
  tags: [tailscale_operator]
  roles:
    - tailscale_operator

# Argo CD is the one workload Ansible installs, because nothing else can:
# it is what installs everything after it (ADR 0005). Bound to
# k3s_first_server so the cluster-wide manifests are applied from exactly
# one place.
- name: Install Argo CD
  hosts: k3s_first_server
  become: true
  tags: [argocd]
  roles:
    - argocd
