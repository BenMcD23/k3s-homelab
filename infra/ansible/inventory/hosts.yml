---
# Tailscale IPs, not MagicDNS names: WSL routes to the tailnet through the
# Windows host but does not inherit its MagicDNS resolver, so names like
# home-server.tail02e471.ts.net do not resolve here. The IPs are stable for
# the life of the node.
all:
  vars:
    tailnet: tail02e471.ts.net
  children:
    amd64:
      hosts:
        home:
          ansible_host: 100.104.255.70   # home-server
          ansible_user: ben
          node_role: interactive
        squadron:
          ansible_host: 100.119.115.96   # 317server
          ansible_user: server317
          node_role: batch
    arm64:
      hosts:
        oracle:
          ansible_host: 100.100.152.108  # k8s-node - VERIFY: ssh oracle tailscale ip -4
          ansible_user: ubuntu
          node_role: edge

    # Bring-up order (ADR 0001). k3s_first_server holds exactly one host,
    # the one that runs --cluster-init, and does not change once the cluster
    # exists. Everything else joins it. A host can be in one of these and an
    # arch group above.
    k3s_first_server:
      hosts:
        home:
    k3s_additional_servers:
      hosts:
        squadron:
        oracle:
