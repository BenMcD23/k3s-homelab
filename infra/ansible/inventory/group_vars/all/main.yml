---
# SSH key used to reach every node. Override on the command line if your
# key lives elsewhere:
#   ansible-playbook site.yml -e ansible_ssh_private_key_file=~/.ssh/other
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_cluster

# Public half of the same key, pushed to every node. Not a secret.
cluster_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMpLPtP5+Ob/Uc3t4Gb1NI92TG8cYUMJDUEm75s6nS2H mcdonaldben02@gmail.com"

# Set false on the first run against a host you cannot easily reach in
# person, until key auth is confirmed working.
harden_ssh: true
