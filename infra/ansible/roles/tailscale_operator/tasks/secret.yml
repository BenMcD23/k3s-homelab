---
# Written before the operator manifest is applied: the Deployment mounts
# this Secret as a volume, so a pod that starts without it never comes up.
#
# no_log throughout, 0600 on the node - the same handling the k3s cluster
# token gets in roles/k3s_server/tasks/config.yml.
- name: Ensure the operator namespace exists
  ansible.builtin.template:
    src: namespace.yaml.j2
    dest: "{{ tailscale_operator_bootstrap_dir }}/namespace.yaml"
    owner: root
    group: root
    mode: "0600"

- name: Create the operator namespace
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ tailscale_operator_bootstrap_dir }}/namespace.yaml"
  environment:
    KUBECONFIG: "{{ tailscale_operator_kubeconfig }}"
  register: tailscale_operator_ns
  changed_when: "'unchanged' not in tailscale_operator_ns.stdout"

- name: Write the OAuth client Secret
  ansible.builtin.template:
    src: oauth-secret.yaml.j2
    dest: "{{ tailscale_operator_bootstrap_dir }}/oauth-secret.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Apply the OAuth client Secret
  ansible.builtin.command:
    cmd: "k3s kubectl apply -f {{ tailscale_operator_bootstrap_dir }}/oauth-secret.yaml"
  environment:
    KUBECONFIG: "{{ tailscale_operator_kubeconfig }}"
  register: tailscale_operator_secret
  changed_when: "'unchanged' not in tailscale_operator_secret.stdout"
  no_log: true
