---
# The CRDs have to be established before any Application can be created, and
# on a first install that happens a moment after the apply returns.
- name: Wait for the Argo CD CRDs to be established
  ansible.builtin.command:
    cmd: "k3s kubectl wait --for=condition=Established crd/{{ item }} --timeout=60s"
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  loop:
    - applications.argoproj.io
    - applicationsets.argoproj.io
    - appprojects.argoproj.io
  changed_when: false

- name: Wait for the Argo CD deployments to roll out
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ argocd_namespace }} rollout status deployment/{{ item }}
      --timeout={{ argocd_ready_timeout }}s
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  loop:
    - argocd-redis
    - argocd-repo-server
    - argocd-server
  changed_when: false

- name: Wait for the application controller to roll out
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n {{ argocd_namespace }} rollout status
      statefulset/argocd-application-controller --timeout={{ argocd_ready_timeout }}s
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"
  changed_when: false
