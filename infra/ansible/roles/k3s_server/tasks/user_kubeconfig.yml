---
# k3s's own kubeconfig is root-only, and that stays: it is cluster-admin. The
# login user gets a private 0600 copy so kubectl and k9s work without sudo.
# Re-copied every run, which also picks up a renewed client certificate.
- name: Look up the login user's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Ensure the login user's ~/.kube exists
  ansible.builtin.file:
    path: "{{ getent_passwd[ansible_user][4] }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copy the kubeconfig for the login user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ getent_passwd[ansible_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# Without it, k3s's bundled kubectl reaches for /etc/rancher/k3s/k3s.yaml,
# can't read it, and falls back to localhost:8080.
- name: Point the login user's shell at it
  ansible.builtin.lineinfile:
    path: "{{ getent_passwd[ansible_user][4] }}/.bashrc"
    line: export KUBECONFIG=$HOME/.kube/config
    regexp: ^export KUBECONFIG=
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    create: true
