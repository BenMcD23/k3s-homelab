---
- name: Check for an existing k3s binary
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_binary

- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_server_version_out
  changed_when: false
  failed_when: false
  check_mode: false
  when: k3s_server_binary.stat.exists

- name: Record the installed k3s version
  ansible.builtin.set_fact:
    k3s_server_current_version: >-
      {{ k3s_server_version_out.stdout | default('')
      | regex_search('k3s version (\S+)', '\1')
      | default([''], true) | first }}

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_server_install_script_url }}"
    dest: "{{ k3s_server_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: k3s_server_current_version != k3s_server_version

# The config file is already in place, so the service comes up correctly
# the first time rather than starting wrong and being restarted into shape.
- name: Install k3s {{ k3s_server_version }}
  ansible.builtin.command:
    cmd: "{{ k3s_server_install_script_path }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_server_version }}"
    INSTALL_K3S_EXEC: server
  when: k3s_server_current_version != k3s_server_version
  changed_when: true

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
