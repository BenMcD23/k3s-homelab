---
# This file is cluster-admin credentials, so it is never logged and lands
# 0600 on the workstation.
- name: Read the cluster kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_raw
  no_log: true

- name: Ensure the local kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ k3s_server_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# k3s writes the file pointing at 127.0.0.1, which is only true on the node
# itself, so it is repointed at the first server's Tailscale IP. The
# cluster/user/context are also renamed off "default" so this can be merged
# into an existing kubeconfig without colliding with something else.
- name: Write the kubeconfig to this machine
  ansible.builtin.copy:
    content: >-
      {{ k3s_server_kubeconfig_raw.content | b64decode
      | replace('https://127.0.0.1:6443', 'https://' ~ k3s_server_node_ip ~ ':6443')
      | regex_replace('(?m)^([ \t]*-?[ \t]*(?:name|cluster|user|current-context):[ \t]*)default[ \t]*$',
      '\1' ~ k3s_server_kubeconfig_context) }}
    dest: "{{ k3s_server_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
