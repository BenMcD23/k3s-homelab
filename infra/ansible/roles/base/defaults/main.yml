---
# SSH hardening. Disabling these locks out password auth - make sure key
# auth works first, especially on squadron (remote site).
base_harden_ssh: true

# k8s sysctls and modules
base_k8s_kernel_modules:
  - br_netfilter
  - overlay

base_k8s_sysctls:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

# Tailscale apt repo. Pinned to the Ubuntu release codename rather than
# tracking "stable" blindly.
base_tailscale_repo_codename: noble
base_tailscale_repo_url: "https://pkgs.tailscale.com/stable/ubuntu"
base_tailscale_gpg_url: "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"

# The secret itself stays named tailscale_auth_key in SOPS - that is an
# inventory variable, not a role one, so it needs no base_ prefix. Empty
# means "skip enrolment": a node already on the tailnet is left alone.
base_tailscale_auth_key: "{{ tailscale_auth_key | default('') }}"

base_chrony_ntp_servers:
  - 0.ubuntu.pool.ntp.org
  - 1.ubuntu.pool.ntp.org
  - 2.ubuntu.pool.ntp.org
