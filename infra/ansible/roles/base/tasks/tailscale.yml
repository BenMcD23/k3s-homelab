---
# Installed from the apt repo rather than the install.sh one-liner: the
# script needs curl (absent on the Oracle Minimal image at first boot) and
# pulls an unpinned installer over the network on every run.
- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ base_tailscale_gpg_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "{{ base_tailscale_repo_url }}"
    suites: ["{{ base_tailscale_repo_codename }}"]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
    enabled: true

# tailscale.com/install.sh writes a legacy one-line tailscale.list. The
# deb822_repository task above writes tailscale.sources. Both present means
# apt reports the repo as configured twice, so the old one is removed.
- name: Remove legacy Tailscale apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status --json
  register: base_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

# Only enrols a node that isn't already on the tailnet. Re-running against
# an enrolled node is a no-op, which is what makes this role safe to
# repeat. An empty auth key skips enrolment entirely rather than failing.
- name: Enrol node in the tailnet
  ansible.builtin.command:
    cmd: "tailscale up --ssh --accept-dns=false --auth-key={{ base_tailscale_auth_key }}"
  when:
    - base_tailscale_auth_key | length > 0
    - (base_tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true
