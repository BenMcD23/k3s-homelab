---
# From the apt repo rather than the install.sh one-liner: the script needs
# curl, which the Oracle Minimal image does not have at first boot, and
# refetches an unpinned installer on every run.
- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ base_tailscale_gpg_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "{{ base_tailscale_repo_url }}"
    suites: ["{{ base_tailscale_repo_codename }}"]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
    enabled: true

# install.sh writes a one-line tailscale.list; the task above writes
# tailscale.sources. With both present apt sees the repo configured twice.
- name: Remove legacy Tailscale apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status --json
  register: base_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

# Skipped if the node is already on the tailnet or no auth key is set, so
# re-running against an enrolled node is a no-op.
- name: Enrol node in the tailnet
  ansible.builtin.command:
    cmd: "tailscale up --accept-dns=false --auth-key={{ base_tailscale_auth_key }}"
  when:
    - base_tailscale_auth_key | length > 0
    - (base_tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true

# Tailscale SSH takes over port 22 on the tailnet IP, which is also what
# Ansible connects to (ansible_host is the 100.x address). That only keeps
# working if the tailnet policy has an "accept" rule for ansible_user: a
# "check" rule asks for a browser login and the play hangs. Add the policy
# rule (README, "Tailscale SSH") before turning this on.
- name: Read Tailscale prefs
  ansible.builtin.command: tailscale debug prefs
  register: base_tailscale_prefs
  changed_when: false
  check_mode: false

# Switching drops the SSH session Ansible is running over (it arrives on
# the tailnet IP), and tailscale refuses without --accept-risk. Fire and
# forget so the dropped connection doesn't fail the task; the next task
# reconnects through whichever SSH now owns port 22.
- name: Set Tailscale SSH
  ansible.builtin.command: "tailscale set --ssh={{ base_tailscale_ssh | lower }} --accept-risk=lose-ssh"
  when: (base_tailscale_prefs.stdout | from_json).RunSSH | default(false) != base_tailscale_ssh
  changed_when: true
  async: 30
  poll: 0

- name: Reset the SSH connection after switching
  ansible.builtin.meta: reset_connection
