---
# From the apt repo rather than the install.sh one-liner: the script needs
# curl, which the Oracle Minimal image does not have at first boot, and
# refetches an unpinned installer on every run.
- name: Add Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ base_tailscale_gpg_url }}"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: "{{ base_tailscale_repo_url }}"
    suites: ["{{ base_tailscale_repo_codename }}"]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
    enabled: true

# install.sh writes a one-line tailscale.list; the task above writes
# tailscale.sources. With both present apt sees the repo configured twice.
- name: Remove legacy Tailscale apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is running
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check current Tailscale state
  ansible.builtin.command: tailscale status --json
  register: base_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

# Skipped if the node is already on the tailnet or no auth key is set, so
# re-running against an enrolled node is a no-op.
- name: Enrol node in the tailnet
  ansible.builtin.command:
    cmd: "tailscale up --ssh --accept-dns=false --auth-key={{ base_tailscale_auth_key }}"
  when:
    - base_tailscale_auth_key | length > 0
    - (base_tailscale_status.stdout | default('{}') | from_json).BackendState | default('') != 'Running'
  changed_when: true
  no_log: true
