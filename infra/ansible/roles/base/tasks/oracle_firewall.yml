---
# The stock OCI Ubuntu image ships /etc/iptables/rules.v4 with a default
# REJECT for inbound traffic, allowing only port 22. It is enforced on the
# host, independently of the console security list: a port opened in the
# security list is still dropped here. This is what governs what reaches
# k3s on this node.
#
# Tailscale inserts its own chains (ts-input, ts-forward) at runtime, jumped
# to before the final REJECT:
#
#   -A INPUT -j ts-input
#   -A ts-input -i tailscale0 -j ACCEPT          <- all tailnet traffic
#   -A ts-input -p udp --dport 41641 -j ACCEPT   <- direct connection port
#   ...
#   -A INPUT -j REJECT --reject-with icmp-host-prohibited
#
# Every k3s port (6443, 2379-2380, 10250, VXLAN 8472) travels over
# tailscale0, so it is accepted before reaching the REJECT. tailscaled
# recreates these chains on every start, so they must not be persisted to
# rules.v4 - a stale copy there conflicts with the live set.
#
# One gap: a pod reaching this node's own API server (10.43.0.1 balances
# over all three, so 1 in 3 connections) arrives on cni0, not tailscale0,
# and was REJECTed as "no route to host". That broke db-switchover runs on
# oracle2 and would hit the CNPG operator and anything failed over here. So
# traffic from local pods (cni0) is accepted too, live and in rules.v4.
# Nothing else here changes the ruleset; the rest only asserts it still
# looks the way the cluster needs.

- name: Accept traffic from pods on this node
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: cni0
    jump: ACCEPT
    action: insert
    comment: k3s pods on this node

# Ahead of the REJECT, so it survives a reboot. Not the Tailscale chains:
# see above.
- name: Persist the pod rule in rules.v4
  ansible.builtin.lineinfile:
    path: /etc/iptables/rules.v4
    line: '-A INPUT -i cni0 -m comment --comment "k3s pods on this node" -j ACCEPT'
    insertbefore: '^-A INPUT -j REJECT --reject-with icmp-host-prohibited'

- name: Read current iptables ruleset
  ansible.builtin.command: iptables -S
  register: base_oracle_iptables
  changed_when: false
  check_mode: false

- name: Assert Tailscale firewall chains are present
  ansible.builtin.assert:
    that:
      - "'-A INPUT -j ts-input' in base_oracle_iptables.stdout"
      - "'-A ts-input -i tailscale0 -j ACCEPT' in base_oracle_iptables.stdout"
    fail_msg: >-
      Tailscale's iptables chains are missing on oracle. k3s traffic over
      the tailnet will be rejected by the stock OCI rules. Check that
      tailscaled is running, then re-run.
    success_msg: Tailscale firewall chains present, tailnet traffic accepted

- name: Assert the stock OCI reject rule has not been removed
  ansible.builtin.assert:
    that:
      - "'-A INPUT -j REJECT --reject-with icmp-host-prohibited' in base_oracle_iptables.stdout"
    fail_msg: >-
      The default REJECT rule is gone from /etc/iptables/rules.v4. The
      console security list allows all TCP from 0.0.0.0/0, so this host is
      now directly exposed. Restore it before continuing.
    success_msg: Stock OCI reject rule intact
