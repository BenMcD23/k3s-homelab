---
# The Oracle Minimal image ships without curl, chrony or
# unattended-upgrades, so they are installed here rather than assumed.
#
# iptables-persistent is not installed: nothing in this role writes iptables
# rules, oracle already has /etc/iptables/rules.v4 from its stock image, and
# on a Docker host it saves Docker's runtime chains to disk and restores them
# at boot, conflicting with the ones dockerd recreates for itself.
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - chrony
      - unattended-upgrades
      # required by ansible.builtin.deb822_repository in tasks/tailscale.yml
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
