# The preview-stack machinery (ADR 0010): the resolver that lists the stacks,
# and the ApplicationSet that turns its list into one Application each. The
# stacks themselves are the chart in ../stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - resolver.yaml
  - applicationset.yaml
  - priorityclass.yaml

# The script runs from this ConfigMap on the stock python image, so there's no
# image to build. The hash suffix rolls the pod when it changes.
configMapGenerator:
  - name: preview-resolver-script
    files:
      - resolver.py
