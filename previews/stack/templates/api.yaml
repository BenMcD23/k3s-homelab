# The API on the seed from app/scripts/dev_server.py: about 60 cadets, staff,
# stores and orders, fake sign-in, no scheduler, no email, no Google. The
# database is an emptyDir, so a new build or a restart starts from a fresh
# seed, and nothing here can reach a real one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pv-{{ .Values.slug }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two pods would seed two databases and split the clicks between them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- include "stack.podSpec" . | nindent 6 }}
      containers:
        - name: api
          image: {{ required "apiImage" .Values.apiImage }}
          command: [python, app/scripts/dev_server.py, --host, "0.0.0.0", --port, "8000", --db, /data/dev.db]
          env:
            # The SMS site calls the API from the browser. dev_server.py sets
            # everything else (ENV=dev, fake auth, email and scheduler off).
            - name: CORS_ORIGINS
              value: {{ include "stack.url" (dict "root" . "part" "sms") }}
          ports:
            - containerPort: 8000
          # Seeding runs before the server listens, about a minute on home.
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pv-{{ .Values.slug }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
# The SMS site's pages call the API straight from the browser, so phones need
# it too.
{{ include "stack.ingress" (dict "root" . "part" "api" "port" 8000) }}
